<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゆるふわ知恵袋アプリ｜大人のための雑学図鑑</title>
<meta name="description" content="ゆるふわ知恵袋の公式Webアプリ。今日の豆知識、豆知識カード、クイズ、お気に入り保存ができます。">
<meta name="theme-color" content="#ff9800">
<link rel="icon" href="../IMG_4679.png">
<link rel="apple-touch-icon" href="../IMG_4679.png">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3571574988222927" crossorigin="anonymous"></script>
<meta name="google-adsense-account" content="ca-pub-3571574988222927">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:#fff8f0;color:#333;line-height:1.65;padding-bottom:76px}
header.app{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#ff9800,#ff4081);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:11px;box-shadow:0 4px 14px rgba(230,81,0,.25)}
header.app img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);background:#fff}
header.app h1{font-size:18px;margin:0}
header.app p{margin:0;font-size:11.5px;opacity:.92}
main{max-width:720px;margin:0 auto;padding:16px 14px 8px}
.view{display:none}
.view.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:20px;position:relative;padding-bottom:8px;margin:22px 0 14px}
h2.sec::after{content:"";position:absolute;left:0;bottom:0;width:52px;height:4px;border-radius:2px;background:linear-gradient(90deg,#ff9800,#ff4081)}
.today{background:#fff;border:2px solid #ffe0b2;border-radius:18px;padding:20px;box-shadow:0 8px 20px rgba(230,81,0,.08)}
.today .lbl{display:inline-block;background:#ff9800;color:#fff;font-size:11.5px;font-weight:bold;padding:3px 11px;border-radius:999px}
.today h3{font-size:21px;margin:10px 0 6px;line-height:1.45}
.today p{font-size:14.5px;color:#555;margin:6px 0}
.btn{display:inline-block;background:#ff9800;color:#fff;border:none;font-weight:bold;padding:11px 20px;border-radius:999px;font-size:14.5px;cursor:pointer;box-shadow:0 4px 12px rgba(255,152,0,.3);text-decoration:none}
.btn.sub{background:#fff;color:#e65100;border:2px solid #ff9800;box-shadow:none}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat3 div{background:#fff;border:2px solid #ffe0b2;border-radius:14px;padding:12px 8px;text-align:center}
.stat3 b{display:block;font-size:22px;color:#e65100;line-height:1.2}
.stat3 span{font-size:11.5px;color:#888}
.search{width:100%;padding:12px 16px;border:2px solid #ffe0b2;border-radius:999px;font-size:15px;background:#fff;margin:0 0 12px}
.search:focus{outline:none;border-color:#ff9800;box-shadow:0 0 0 4px rgba(255,152,0,.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:2px solid #ff9800;background:#fff;color:#e65100;font-weight:bold;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip.on{background:#ff9800;color:#fff}
.tcard{background:#fff;border:2px solid #ffe0b2;border-radius:16px;padding:16px 18px;margin:0 0 12px;box-shadow:0 4px 12px rgba(230,81,0,.06)}
.tcard h3{margin:0 0 6px;font-size:17px;line-height:1.45}
.tcard p{margin:6px 0;font-size:14px;color:#555}
.tag{display:inline-block;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:999px;color:#fff;background:#8e24aa;margin-right:6px}
.favbtn{margin-top:8px;background:#fff;border:2px solid #ffcc80;color:#e65100;font-weight:bold;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.favbtn.on{background:#ff9800;border-color:#ff9800;color:#fff}
.quiz-q{background:#fff;border:2px solid #ffe0b2;border-radius:16px;padding:16px 18px;margin:0 0 14px}
.quiz-q h3{margin:0 0 6px;font-size:16.5px}
.quiz-q .ex{display:none;background:#e8f5e9;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.quiz-q button{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;border:2px solid #ffe0b2;background:#fff8f0;border-radius:10px;font-size:14.5px;cursor:pointer}
.quiz-q button.ok{border-color:#43a047;background:#e8f5e9}
.quiz-q button.ng{border-color:#e53935;background:#ffebee}
#score{font-size:18px;font-weight:bold;color:#e65100}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #ffe0b2;display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:none;padding:9px 4px 8px;font-size:12px;font-weight:bold;color:#999;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:#e65100}
nav.tabs svg{width:23px;height:23px}
.empty{color:#999;text-align:center;padding:28px 0;font-size:14px}
.foot-note{text-align:center;color:#bbb;font-size:12px;margin:26px 0 6px}
.foot-note a{color:#bbb}
</style>
</head>
<body>
<header class="app">
  <img src="../IMG_4679.png" alt="ゆるふわ知恵袋">
  <div><h1>ゆるふわ知恵袋アプリ</h1><p>大人のための雑学図鑑</p></div>
</header>
<main>

<!-- ホーム -->
<section class="view on" id="v-home">
  <h2 class="sec">今日の豆知識</h2>
  <div class="today">
    <span class="lbl" id="today-date"></span>
    <h3 id="today-title"></h3>
    <p id="today-body"></p>
    <div class="row">
      <button class="btn" id="today-fav">お気に入りに追加</button>
      <a class="btn sub" id="today-link" href="../index.html">サイトでくわしく読む</a>
    </div>
  </div>
  <div class="row">
    <button class="btn" id="rand-btn">ランダムで1つ見る</button>
    <button class="btn sub" id="goto-quiz">クイズに挑戦</button>
  </div>
  <div class="today" id="rand-box" style="display:none;margin-top:14px">
    <span class="lbl">ランダム豆知識</span>
    <h3 id="rand-title"></h3>
    <p id="rand-body"></p>
  </div>
  <h2 class="sec">あなたの記録</h2>
  <div class="stat3">
    <div><b id="st-read">0</b><span>読んだ豆知識</span></div>
    <div><b id="st-fav">0</b><span>お気に入り</span></div>
    <div><b id="st-best">-</b><span>クイズ最高得点</span></div>
  </div>
  <p style="font-size:12.5px;color:#999;margin-top:10px">記録はこの端末の中にだけ保存されます。</p>
</section>

<!-- 一覧 -->
<section class="view" id="v-list">
  <h2 class="sec">豆知識一覧</h2>
  <input class="search" type="text" id="q" placeholder="キーワードで検索（例：富士山、500円、サイコロ）">
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <p class="empty" id="list-empty" style="display:none">見つかりませんでした。別のキーワードで試してみてください。</p>
</section>

<!-- クイズ -->
<section class="view" id="v-quiz">
  <h2 class="sec">ゆるふわクイズ</h2>
  <p style="font-size:14px;color:#555">全5問。答えを選ぶと、解説が出ます。</p>
  <div id="quiz"></div>
  <p id="score"></p>
  <button class="btn sub" id="quiz-reset">もう一度やる</button>
</section>

<!-- お気に入り -->
<section class="view" id="v-fav">
  <h2 class="sec">お気に入り</h2>
  <div id="favlist"></div>
  <p class="empty" id="fav-empty">まだお気に入りがありません。一覧から気になる豆知識を追加してみてください。</p>
</section>

<p class="foot-note"><a href="../index.html">ゆるふわ知恵袋 公式サイトへ</a></p>
</main>

<nav class="tabs">
  <button data-v="v-home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 4 L21 11"/><path d="M5 10 V20 H19 V10"/></svg>ホーム</button>
  <button data-v="v-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>一覧</button>
  <button data-v="v-quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3 A2.6 2.6 0 1 1 12 12.4 V13.6"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>クイズ</button>
  <button data-v="v-fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5 L4.8 13.6 A5 5 0 0 1 12 6.4 A5 5 0 0 1 19.2 13.6 Z"/></svg>お気に入り</button>
</nav>

<script>
var TRIVIA = [
 {id:"fuji1", cat:"日本", title:"富士山の8合目から上は神社の土地", body:"富士山の8合目以上（約385万平方メートル、東京ドーム約82個分）は、富士山本宮浅間大社の境内地です。山頂に立っている場所は、神社の境内ということになります。", page:"../fuji.html"},
 {id:"fuji2", cat:"日本", title:"富士山の土地を決めたのは徳川家康", body:"1609年、徳川家康が浅間大社に朱印状を与えたことが出発点です。明治時代に一度は国の土地になりましたが、1974年の最高裁判決で神社の所有が認められ、2004年に正式に返還されました。", page:"../fuji.html"},
 {id:"senen1", cat:"お金", title:"1万円玉を作らない理由は偽造対策", body:"安い金属で1万円玉を作ると、額面のわりに材料費が安く、偽造が大儲けになってしまいます。防ぐには高い金属か大きな硬貨が必要で、どちらも現実的ではありません。", page:"../senen.html"},
 {id:"senen2", cat:"お金", title:"500円玉は偽造で大問題になった", body:"500円硬貨は一般流通硬貨として世界でも有数の高額硬貨です。外国の硬貨を加工した変造硬貨の事件を受けて、2000年に素材変更と偽造対策の強化が行われました。", page:"../senen.html"},
 {id:"senen3", cat:"お金", title:"新しい500円玉は2色・3層構造", body:"2021年発行の500円硬貨は「バイカラー・クラッド」という2色・3層構造を採用。2024年には20年ぶりの新しいお札も発行され、偽造防止の技術が進化し続けています。", page:"../senen.html"},
 {id:"senen4", cat:"お金", title:"お札は1枚約1グラム", body:"500円玉は1枚7.1グラム、お札は1枚約1グラム。大きな金額を持ち運ぶ軽さでも、お札が圧倒的に有利です。", page:"../senen.html"},
 {id:"nichigin1", cat:"日本", title:"日銀の形は「円」に見える", body:"日本銀行本店を上から見ると「円」の字に見えます。でも完成した1896年当時の表記は「圓」。今の形は後の増築の結果で、意図せず生まれた奇跡の形だと言われています。", page:"../nichigin.html"},
 {id:"saikoro1", cat:"くらし", title:"サイコロの赤い「1」は日本だけ", body:"海外のサイコロはすべての目が同色なのが一般的。1だけ赤いのは日本の特徴で、1926年に和歌山の業者が日の丸に見立てて赤く塗ったところ大ヒットした、という説があります。", page:"../saikoro.html"},
 {id:"muse1", cat:"テクノロジー", title:"AIに無茶振りしたら39種類のゲームができた", body:"「対戦ゲーム作って」と頼んだら39種類が完成し、「予定を全部入れて」と頼んだら109件が入力されました。答えるだけでなく、作業そのものを実行するのがエージェント型AIです。", page:"../muse.html"}
];
var QUIZ = [
 {q:"富士山の8合目から上は、誰の土地？", a:["神社","国","静岡県"], c:0, ex:"富士山本宮浅間大社の境内地です。広さは東京ドーム約82個分。"},
 {q:"500円玉が2000年に作り直された大きな理由は？", a:["軽くするため","偽造が大問題になったから","色を変えたかったから"], c:1, ex:"変造硬貨の事件を受けて、素材変更と偽造対策の強化が行われました。"},
 {q:"サイコロの「1」だけ赤いのは？", a:["世界共通","ヨーロッパだけ","日本だけ"], c:2, ex:"日の丸に見立てて赤く塗ったのが始まり、という説が有力です。"},
 {q:"日銀の建物が「円」に見える形になったのは？", a:["増築の結果の偶然","最初から狙った設計","法律で決まっている"], c:0, ex:"完成当時の表記は「圓」で、今の形は増築の結果です。"},
 {q:"1万円玉を作らない大きな理由は？", a:["重すぎるから","金属が足りないから","偽造が儲かりすぎるから"], c:2, ex:"安い金属だと額面と材料費の差が大きく、偽造が割に合ってしまいます。"}
];
var CATS = ["すべて","お金","日本","くらし","テクノロジー"];
var favs = JSON.parse(localStorage.getItem("yf_favs") || "[]");
var read = JSON.parse(localStorage.getItem("yf_read") || "[]");
function saveFavs(){ localStorage.setItem("yf_favs", JSON.stringify(favs)); }
function saveRead(){ localStorage.setItem("yf_read", JSON.stringify(read)); }
function markRead(id){ if(read.indexOf(id) < 0){ read.push(id); saveRead(); } renderStats(); }
function isFav(id){ return favs.indexOf(id) >= 0; }
function toggleFav(id){
  var i = favs.indexOf(id);
  if(i >= 0) favs.splice(i,1); else favs.push(id);
  saveFavs(); renderAll();
}
function renderStats(){
  document.getElementById("st-read").textContent = read.length;
  document.getElementById("st-fav").textContent = favs.length;
  var best = localStorage.getItem("yf_best");
  document.getElementById("st-best").textContent = best ? best + " / 5" : "-";
}
function todayItem(){
  var now = new Date();
  var seed = now.getFullYear()*10000 + (now.getMonth()+1)*100 + now.getDate();
  return TRIVIA[seed % TRIVIA.length];
}
function renderToday(){
  var it = todayItem();
  var now = new Date();
  document.getElementById("today-date").textContent = (now.getMonth()+1) + "月" + now.getDate() + "日の豆知識";
  document.getElementById("today-title").textContent = it.title;
  document.getElementById("today-body").textContent = it.body;
  document.getElementById("today-link").href = it.page;
  var b = document.getElementById("today-fav");
  b.textContent = isFav(it.id) ? "お気に入り済み" : "お気に入りに追加";
  b.onclick = function(){ toggleFav(it.id); renderToday(); };
  markRead(it.id);
}
function cardHTML(it){
  return '<div class="tcard"><span class="tag">' + it.cat + '</span><h3>' + it.title + '</h3><p>' + it.body + '</p>' +
    '<button class="favbtn' + (isFav(it.id) ? " on" : "") + '" data-fav="' + it.id + '">' + (isFav(it.id) ? "お気に入り済み" : "お気に入りに追加") + '</button> ' +
    '<a href="' + it.page + '" style="font-size:13px">サイトで読む</a></div>';
}
var curCat = "すべて";
function renderList(){
  var q = document.getElementById("q").value.trim();
  var html = "", n = 0;
  TRIVIA.forEach(function(it){
    var ok = (curCat === "すべて" || it.cat === curCat) && (!q || (it.title + it.body + it.cat).indexOf(q) >= 0);
    if(ok){ html += cardHTML(it); n++; markReadSilent(it.id); }
  });
  document.getElementById("list").innerHTML = html;
  document.getElementById("list-empty").style.display = n ? "none" : "";
  bindFavs();
}
function markReadSilent(id){ if(read.indexOf(id) < 0){ read.push(id); saveRead(); } renderStats(); }
function renderFavs(){
  var html = "";
  TRIVIA.forEach(function(it){ if(isFav(it.id)) html += cardHTML(it); });
  document.getElementById("favlist").innerHTML = html;
  document.getElementById("fav-empty").style.display = favs.length ? "none" : "";
  bindFavs();
}
function bindFavs(){
  document.querySelectorAll("[data-fav]").forEach(function(b){
    b.onclick = function(){ toggleFav(b.dataset.fav); };
  });
}
function renderChips(){
  var h = "";
  CATS.forEach(function(c){ h += '<button class="chip' + (c === curCat ? " on" : "") + '" data-cat="' + c + '">' + c + '</button>'; });
  document.getElementById("chips").innerHTML = h;
  document.querySelectorAll("#chips .chip").forEach(function(b){
    b.onclick = function(){ curCat = b.dataset.cat; renderChips(); renderList(); };
  });
}
var answered = 0, score = 0;
function buildQuiz(){
  answered = 0; score = 0;
  document.getElementById("score").textContent = "";
  var h = "";
  QUIZ.forEach(function(item, i){
    h += '<div class="quiz-q"><h3>Q' + (i+1) + ". " + item.q + '</h3>';
    item.a.forEach(function(t, j){ h += '<button data-q="' + i + '" data-a="' + j + '">' + t + '</button>'; });
    h += '<div class="ex" id="ex' + i + '"></div></div>';
  });
  document.getElementById("quiz").innerHTML = h;
  document.querySelectorAll("#quiz button[data-q]").forEach(function(b){
    b.onclick = function(){
      var box = b.parentNode;
      if(box.dataset.done) return;
      box.dataset.done = 1; answered++;
      var i = +b.dataset.q, j = +b.dataset.a, ok = j === QUIZ[i].c;
      b.classList.add(ok ? "ok" : "ng");
      if(ok) score++;
      var ex = document.getElementById("ex" + i);
      ex.style.display = "block";
      ex.textContent = (ok ? "正解！ " : "残念、正解は「" + QUIZ[i].a[QUIZ[i].c] + "」。 ") + QUIZ[i].ex;
      if(answered === QUIZ.length){
        document.getElementById("score").textContent = "結果：" + score + " / " + QUIZ.length + " 問正解！" + (score === QUIZ.length ? " 全問正解、立派な知恵袋です。" : "");
        var best = +(localStorage.getItem("yf_best") || 0);
        if(score > best){ localStorage.setItem("yf_best", score); }
        renderStats();
      }
    };
  });
}
function renderAll(){ renderStats(); renderList(); renderFavs(); }
document.querySelectorAll("nav.tabs button").forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll("nav.tabs button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("on"); });
    document.getElementById(b.dataset.v).classList.add("on");
    window.scrollTo(0, 0);
  };
});
document.getElementById("q").addEventListener("input", renderList);
document.getElementById("quiz-reset").onclick = buildQuiz;
document.getElementById("rand-btn").onclick = function(){
  var it = TRIVIA[Math.floor(Math.random() * TRIVIA.length)];
  document.getElementById("rand-box").style.display = "block";
  document.getElementById("rand-title").textContent = it.title;
  document.getElementById("rand-body").textContent = it.body;
  markRead(it.id);
};
document.getElementById("goto-quiz").onclick = function(){
  document.querySelector('[data-v="v-quiz"]').click();
};
renderChips(); renderToday(); renderAll(); buildQuiz();
</script>
</body>
</html>
