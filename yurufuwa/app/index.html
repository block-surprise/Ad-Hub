<style>
:root{
  --bg:#fdf6ec; --surface:#ffffff; --line:#eee0cd; --text:#33291f; --sub:#97826a;
  --accent:#e07f3e; --accent-deep:#c2611d; --accent-soft:#fdeed9; --chip:#f7ecdc;
  --good:#4c8055; --good-bg:#edf3ee; --bad:#b5503c; --bad-bg:#f9eeee; --sheet-bg:rgba(51,41,31,.42);
}
:root[data-theme="dark"]{
    --bg:#1a1611; --surface:#242019; --line:#3d362b; --text:#f0e9dd; --sub:#ab9d88;
    --accent:#e08d4f; --accent-deep:#eda76a; --accent-soft:#3c2d1c; --chip:#2e2921;
    --good:#8fbf9a; --good-bg:#22301f; --bad:#d99a8c; --bad-bg:#38231e; --sheet-bg:rgba(0,0,0,.55);
  }
[data-theme="dark"] .tile{filter:brightness(.82) saturate(.7)}
*{-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
button,.rowitem,.chip,.starbtn{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rowitem{transition:background .15s ease}
.rowitem:active{background:var(--accent-soft)}
.btn{transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.chip{transition:transform .12s ease}
.chip:active{transform:scale(.95)}
.starbtn{transition:transform .15s ease}
.starbtn:active{transform:scale(1.25)}
.tbtn:active{opacity:.55}
nav.tabs button{transition:color .15s ease}
nav.tabs button:active{color:var(--accent-deep)}
.bellbtn{position:relative;background:rgba(255,255,255,.65);border:1px solid var(--line);width:38px;height:38px;border-radius:50%;cursor:pointer;color:var(--accent-deep);display:flex;align-items:center;justify-content:center;flex:none}
[data-theme="dark"] .bellbtn{background:rgba(0,0,0,.25)}
.bellbtn:active{transform:scale(.94)}
.bellbtn svg{width:20px;height:20px}
.bellbtn .badge{position:absolute;top:-4px;right:-4px;background:#d84a3a;color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
.bellbtn .badge.show{display:flex}
.news-item{padding:14px 2px;border-bottom:1px solid var(--line)}
.news-item:last-child{border-bottom:none}
.news-item .nd{font-size:11.5px;color:var(--sub)}
.news-item .nt{font-weight:700;font-size:15.5px;margin:2px 0 3px}
.news-item .nb{font-size:13.5px;color:var(--sub)}
.news-item{cursor:pointer}
.news-item:active{background:var(--accent-soft)}
.news-item .chev{color:var(--accent);font-weight:700;float:right;font-size:17px}
.news-detail p{font-size:14.5px;margin:10px 0}
.member-card{background:linear-gradient(140deg,#fff3df,#ffe9ee);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
[data-theme="dark"] .member-card{background:linear-gradient(140deg,#2c2115,#2c1e22)}
.member-card .avatar{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.member-card .mname{font-size:19px;font-weight:800}
.member-card .mrank{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:3px 12px;margin-top:6px}
.member-card .msince{font-size:12px;color:var(--sub);margin-top:8px}
.field{margin:10px 0}
.field label{display:block;font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:4px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;background:var(--surface);color:var(--text)}
.field input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin:8px 0 0}
.benefits{background:var(--chip);border-radius:12px;padding:12px 16px;font-size:14px;margin:12px 0}
.benefits li{margin:4px 0}
.lockbox{text-align:center;padding:14px 6px 4px}
.lockbox .lk{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--accent-deep)}
.lockbox .lk svg{width:27px;height:27px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#3c4043;border:1.5px solid var(--line);border-radius:11px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.gbtn:active{opacity:.85}
.gbtn svg{width:19px;height:19px;flex:none}
.ordiv{text-align:center;color:var(--sub);font-size:12.5px;margin:12px 0 0}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding-bottom:80px;-webkit-text-size-adjust:100%}
body.large .body-txt, body.large .face p, body.large .sheet .pts{font-size:16.5px}
body.large .rowitem .ttl{font-size:16.5px}
body.large .rowitem .dsc{font-size:13.5px}
body.large .quiz-q button.opt{font-size:16.5px}
body.large .quiz-q h3{font-size:18.5px}
header.app{position:sticky;top:0;z-index:40;background:linear-gradient(120deg,#fff3df,#ffe9ee);border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:10px}
[data-theme="dark"] header.app{background:linear-gradient(120deg,#2c2115,#2c1e22)}
header.app img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.12);background:#fff}
header.app h1{font-size:16.5px;margin:0;font-weight:700}
header.app p{margin:0;font-size:11px;color:var(--sub)}
.streak{margin-left:auto;background:rgba(255,255,255,.65);border:1px solid var(--line);color:var(--sub);font-size:12px;white-space:nowrap;border-radius:999px;padding:4px 11px}
[data-theme="dark"] .streak{background:rgba(0,0,0,.25)}
.streak b{color:var(--accent-deep);font-size:14px}
main{max-width:680px;margin:0 auto;padding:18px 16px 8px}
.view{display:none}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
h2.sec{font-size:15.5px;font-weight:700;margin:28px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--accent);flex:none}
h2.sec:first-child{margin-top:4px}
.search{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--surface);color:var(--text)}
.search:focus{outline:none;border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card.today{background:linear-gradient(165deg,#fff8ec,#ffffff 55%)}
[data-theme="dark"] .card.today{background:linear-gradient(165deg,#2c2318,#242019 55%)}
.today-top{display:flex;gap:13px;align-items:flex-start}
.tile{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:35px;height:35px}
.tile.sm{width:46px;height:46px;border-radius:12px}
.tile.sm svg{width:30px;height:30px}
.kicker{font-size:11.5px;color:var(--accent-deep);font-weight:700;letter-spacing:.05em}
.card h3{font-size:19px;margin:3px 0 5px;line-height:1.5}
.body-txt{font-size:14.5px;color:var(--sub);margin:6px 0 0}
.actions{display:flex;gap:18px;margin-top:14px;align-items:center;flex-wrap:wrap}
.tbtn{background:none;border:none;color:var(--accent-deep);font-weight:700;font-size:14.5px;cursor:pointer;padding:6px 2px;white-space:nowrap}
.tbtn.plain{color:var(--sub);font-weight:600}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;font-weight:700;padding:12px 22px;border-radius:12px;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rowitem{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;color:var(--text);font-size:15px}
.rowitem:last-child{border-bottom:none}
.rowitem .grow{flex:1;min-width:0}
.rowitem .ttl{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .dsc{font-size:12.5px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .cnt{color:var(--sub);font-size:13px;white-space:nowrap}
.rowitem .chev{color:var(--accent);font-size:19px;font-weight:700}
.starbtn{background:none;border:none;cursor:pointer;padding:6px;color:#d8c9ae;flex:none}
.starbtn.on{color:var(--accent)}
.starbtn svg{width:22px;height:22px;display:block}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--sub);margin-right:5px;vertical-align:2px;white-space:nowrap}
.tag.app{color:var(--accent-deep);background:var(--accent-soft)}
.tag.new{color:var(--bad);background:var(--bad-bg)}
.stats{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stats div{flex:1;text-align:center;padding:13px 2px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:none}
.stats b{display:block;font-size:19px;line-height:1.25;color:var(--accent-deep)}
.stats span{font-size:11px;color:var(--sub)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--sub);font-weight:600;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
.sortbar{display:flex;gap:14px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.sortbar select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:13.5px}
.progress{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin:10px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#eda76a);border-radius:99px;transition:width .35s ease}
.flash{perspective:1200px}
.flash-in{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:260px;cursor:pointer}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);background:var(--surface)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);justify-content:flex-start;overflow:auto;text-align:left;align-items:stretch}
.face h3{font-size:19px;margin:10px 0 6px;line-height:1.55}
.face p{font-size:14.5px;color:var(--sub)}
.face.back p{color:var(--text)}
.face .hint{font-size:12px;color:var(--sub);margin-top:12px}
.quiz-q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.quiz-q h3{margin:2px 0 8px;font-size:17px;line-height:1.55}
.quiz-q .ex{display:none;background:var(--good-bg);border-radius:10px;padding:11px 13px;font-size:13.5px;margin-top:10px}
.quiz-q button.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 15px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:11px;font-size:15px;cursor:pointer}
.quiz-q button.opt.ok{border-color:var(--good);background:var(--good-bg)}
.quiz-q button.opt.ng{border-color:var(--bad);background:var(--bad-bg)}
.result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;display:none}
.result .rank{font-size:20px;font-weight:700;margin:4px 0;color:var(--accent-deep)}
.result .score{font-size:36px;font-weight:800;margin:2px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:none;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--accent-deep)}
nav.tabs svg{width:22px;height:22px}
.empty{color:var(--sub);text-align:center;padding:30px 0;font-size:14px}
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:var(--sheet-bg)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:0 20px 28px;animation:up .28s ease;max-width:680px;margin:0 auto;will-change:transform}
@keyframes up{from{transform:translateY(36px);opacity:.5}to{transform:none;opacity:1}}
.sheet .dragzone{padding:10px 0 6px;cursor:grab;touch-action:none;position:relative}
.sheet .handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet .panel{user-select:none;-webkit-user-select:none}
.sheet h3{font-size:20px;margin:6px 0 6px;line-height:1.5}
.sheet .pts{background:var(--chip);border-radius:12px;padding:12px 16px;font-size:14px;margin-top:14px}
.sheet .src{font-size:12px;color:var(--sub);margin-top:12px}
.sheet .abtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.sheet .abtns .full{grid-column:1 / -1}
.sheet .abtns button, .sheet .abtns a{padding:13px 8px;border-radius:12px;font-size:14.5px;font-weight:700;text-align:center;cursor:pointer;text-decoration:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.sheet .abtns .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.sheet .rel-h{font-size:13px;color:var(--sub);font-weight:700;margin:22px 0 8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:80;white-space:nowrap}
.toast.show{opacity:.95}
.foot-note{text-align:center;color:var(--sub);font-size:12px;margin:28px 0 6px}
.foot-note a{color:var(--sub)}
.setrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:14px}
.setrow .grow{flex:1}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);color:var(--sub);padding:8px 14px;font-size:13.5px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent-deep)}
</style>
</head>
<body>
<header class="app">
  <img src="../IMG_4679.png" alt="ゆるふわ知恵袋">
  <div><h1>ゆるふわ知恵袋</h1><p>大人のための雑学図鑑</p></div>
  <div class="streak" id="streak">連続 <b>1</b> 日</div>
  <button class="bellbtn" id="account-btn" aria-label="マイページ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5 a7.5 7.5 0 0 1 15 0"/></svg></button>
  <button class="bellbtn" id="bell" aria-label="お知らせ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9 a6 6 0 1 0-12 0 c0 6-2.5 7-2.5 7 h17 S18 15 18 9"/><path d="M10 20 a2.2 2.2 0 0 0 4 0"/></svg><span class="badge" id="bell-badge"></span></button>
</header>
<main>

<section class="view on" id="v-home">
  <input class="search" type="text" id="q-home" placeholder="豆知識を検索（例：富士山、ポスト）">
  <h2 class="sec">今日の豆知識</h2>
  <div class="card today" id="today-box"></div>
  <div id="next-sec">
    <h2 class="sec">次に読む（未読から）</h2>
    <div class="rows" id="next-list"></div>
  </div>
  <h2 class="sec">やってみる</h2>
  <div class="rows">
    <button class="rowitem" id="act-random"><span class="grow"><span class="ttl">ランダムで1つ読む</span><span class="dsc">何が出るかはお楽しみ</span></span><span class="chev">›</span></button>
    <button class="rowitem" id="act-cards"><span class="grow"><span class="ttl">フラッシュカードで覚える</span><span class="dsc">タップで裏返る学習カード</span></span><span class="chev">›</span></button>
    <button class="rowitem" id="act-quiz"><span class="grow"><span class="ttl">クイズに挑戦する</span><span class="dsc">全10問／ランダム5問／間違えた問題の復習</span></span><span class="chev">›</span></button>
  </div>
  <h2 class="sec">カテゴリ</h2>
  <div class="rows" id="cat-rows"></div>
  <div id="recent-sec">
    <h2 class="sec">最近見た豆知識</h2>
    <div class="rows" id="recent-list"></div>
  </div>
  <h2 class="sec">あなたの記録</h2>
  <div class="stats">
    <div><b id="st-read">0</b><span>読んだ数</span></div>
    <div><b id="st-fav">0</b><span>お気に入り</span></div>
    <div><b id="st-learn">0</b><span>覚えたカード</span></div>
    <div><b id="st-best">-</b><span>クイズ最高</span></div>
  </div>
  <div style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--sub)"><span>総合達成率（読んだ＋覚えた）</span><b id="achieve-pct" style="color:var(--accent-deep)">0%</b></div>
    <div class="progress" style="margin:6px 0 0"><i id="achieve-bar" style="width:0%"></i></div>
  </div>
  <h2 class="sec">設定</h2>
  <div class="setrow">
    <span class="grow">文字の大きさ</span>
    <div class="seg">
      <button id="font-normal">標準</button>
      <button id="font-large">大きめ</button>
    </div>
  </div>
  <div class="setrow" style="margin-top:10px">
    <span class="grow">テーマ</span>
    <div class="seg">
      <button id="theme-auto">自動</button>
      <button id="theme-light">ライト</button>
      <button id="theme-dark">ダーク</button>
    </div>
  </div>
  <p style="font-size:12px;color:var(--sub);margin-top:10px">記録はこの端末の中にだけ保存されます。</p>
</section>

<section class="view" id="v-list">
  <h2 class="sec">豆知識一覧</h2>
  <input class="search" type="text" id="q" placeholder="キーワードで検索">

var TRIVIA = [{"id": "fuji1", "cat": "日本", "icon": "fuji", "color": "#e3f2fd", "title": "富士山の8合目から上は神社の土地", "short": "山頂は国の土地ではなく、神社の境内地です。", "body": "富士山の8合目以上は、富士山本宮浅間大社の境内地です。広さは約385万平方メートルで、東京ドーム約82個分。登山道の後半は、神社の境内を登っていることになります。", "points": ["広さは約385万平方メートル（東京ドーム約82個分）", "所有者は富士山本宮浅間大社（静岡県富士宮市）", "山頂に立つ場所は「神社の境内」"], "source": "富士山本宮浅間大社・静岡県の文化財資料など", "page": "../fuji.html", "isNew": false}, {"id": "fuji2", "cat": "日本", "icon": "fuji", "color": "#e3f2fd", "title": "富士山の土地を決めたのは徳川家康", "short": "1609年の朱印状から、2004年の正式返還まで。", "body": "富士山山頂部の権利の出発点は、1609年に徳川家康が浅間大社へ与えた朱印状です。明治時代に一度は国の土地になりましたが、1974年の最高裁判決で神社の所有が認められ、2004年に正式に返還されました。", "points": ["1609年：家康の朱印状", "1974年：最高裁で神社の所有が確定", "2004年：正式に譲渡（返還）"], "source": "静岡県「史跡富士山 保存管理計画」など", "page": "../fuji.html", "isNew": false}, {"id": "senen1", "cat": "お金", "icon": "coin", "color": "#fff8e1", "title": "1万円玉を作らない理由は偽造対策", "short": "「作ればいいじゃん」への答えは、偽造の儲け。", "body": "安い金属で1万円玉を作ると、額面1万円に対して材料費がわずかなので、偽造すれば大儲けになってしまいます。防ぐには高い金属を使うか大きく重く作るしかなく、どちらも現実的ではありません。だから高額は、高度な偽造防止を入れられるお札が担っています。", "points": ["安い金属＝偽造が儲かりすぎる", "高い金属＝相場が上がると溶かされるリスク", "お札は透かし・ホログラムなど高度な対策が可能"], "source": "造幣局・国立印刷局の公開情報など", "page": "../senen.html", "isNew": false}, {"id": "senen2", "cat": "お金", "icon": "coin", "color": "#fff8e1", "title": "500円玉は偽造で大問題になった", "short": "世界有数の高額硬貨ゆえの事件と、緊急の作り直し。", "body": "500円硬貨は、普通に流通する硬貨としては世界でも有数の高額硬貨です。外国の低価値硬貨を加工した変造硬貨が大量に出回る事件が起き、2000年に素材を変えた新しい500円玉への緊急の作り直しが行われました。2021年には2色・3層構造のバイカラー・クラッドが採用されています。", "points": ["500円硬貨は世界でも有数の高額な流通硬貨", "2000年に素材変更＋偽造対策を強化", "2021年にバイカラー・クラッド採用"], "source": "造幣局の硬貨資料など", "page": "../senen.html", "isNew": false}, {"id": "senen3", "cat": "お金", "icon": "bill", "color": "#fff8e1", "title": "お札は1枚約1グラム", "short": "500円玉20枚との差は、約142倍。", "body": "お札の重さは1枚約1グラム。一方、500円玉は1枚7.1グラムあるので、1万円分を500円玉で持つと20枚で約142グラムになります。大きな金額を持ち運ぶ軽さでも、お札が圧倒的に有利です。", "points": ["お札：1枚約1グラム", "500円玉：1枚7.1グラム", "1万円分＝500円玉20枚で約142グラム"], "source": "国立印刷局・造幣局の公開情報など", "page": "../senen.html", "isNew": false}, {"id": "nichigin1", "cat": "日本", "icon": "bank", "color": "#efebe9", "title": "日銀の形は「円」に見える", "short": "でも完成当時の漢字は「圓」でした。", "body": "日本銀行本店を上から見ると「円」の字に見えます。ところが建物が完成した1896年当時、お金の単位の漢字は「圓」。設計で今の「円」を狙ったわけではなく、後の増築の結果として生まれた、奇跡のような形だと言われています。", "points": ["完成は1896年（明治29年）", "当時の表記は「圓」", "今の形は増築の結果"], "source": "日本銀行の公開資料など", "page": "../nichigin.html", "isNew": false}, {"id": "saikoro1", "cat": "くらし", "icon": "dice", "color": "#fce4ec", "title": "サイコロの赤い「1」は日本だけ", "short": "日の丸に見立てたのが始まり、という説。", "body": "海外のサイコロは、すべての目が黒など同色なのが一般的です。1だけ赤いのは日本のサイコロの特徴で、1926年に和歌山の業者が「1」を日の丸に見立てて赤く塗ったところ大ヒットした、という説があります。", "points": ["海外のサイコロは全目が同色が一般的", "始まりは1926年という説", "日の丸に見立てて赤く塗った"], "source": "各種報道・資料で紹介される説", "page": "../saikoro.html", "isNew": false}, {"id": "muse1", "cat": "テクノロジー", "icon": "robot", "color": "#e0f2f1", "title": "AIに無茶振りしたら全部やってきた件", "short": "「ゲーム作って」→39種類、「予定入れて」→109件。", "body": "「対戦ゲーム作って」と頼んだら39種類が完成し、「予定を全部入れて」と頼んだら109件が入力されました。質問に答えるだけでなく、調べる・作る・入力するといった作業そのものを実行するのが、エージェント型AIの特徴です。", "points": ["対戦ゲームは実際に39種類完成", "予定入力は実際に109件", "数字はすべて実話ベース"], "source": "ゆるふわ知恵袋の制作記録", "page": "../muse.html", "isNew": false}, {"id": "app-ichien", "cat": "お金", "icon": "drop", "color": "#e1f5fe", "title": "1円玉は水に浮く", "short": "重さちょうど1グラム、そっと置くと浮きます。", "body": "1円玉は純アルミニウム製で、直径20ミリ、重さはちょうど1グラム。乾いた1円玉を水面に平行にそっと置くと、表面張力と浮力が釣り合って、水に浮かせることができます。表面には「若木」のデザインが描かれています。", "points": ["直径20ミリ・重さちょうど1グラム", "素材は純アルミニウム（1955年〜）", "表面張力で水に浮く"], "source": "造幣局の硬貨規格など", "page": null, "isNew": true}, {"id": "app-ichiencost", "cat": "お金", "icon": "coin", "color": "#fff8e1", "title": "1円玉を作るのに約3円かかる", "short": "額面より高い製造コスト。", "body": "1円硬貨1枚を作る製造コストは、額面の1円を上回ります。2015年時点の試算では約3円とされていました。アルミニウムの価格や製造方法で変動しますが、「作るほど赤字」という逆転現象が起きている硬貨です。5円・10円硬貨も同様に額面以上のコストとされています。", "points": ["製造コストは額面以上", "2015年時点の試算で約3円", "5円・10円も同様とされる"], "source": "造幣局への取材報道など", "page": null, "isNew": true}, {"id": "app-post", "cat": "くらし", "icon": "post", "color": "#ffebee", "title": "郵便ポストは、最初は黒かった", "short": "勘違い事件がきっかけで赤になりました。", "body": "日本の郵便ポストは、始まりの1871年当時は木製や黒塗りでした。ところが黒いポストは夜に見えにくく、「郵便」を「垂便」と読み違える勘違いまで発生。そこで1901年に鉄製の赤いポストが試験導入され、「目立って分かりやすい色」として赤が定着し、1908年に正式に定められました。", "points": ["1871年の開始当初は黒や木製", "1901年に赤い鉄製ポストを試験導入", "理由は「目立って分かりやすく」"], "source": "郵便ポストの歴史資料・逓信省年報など", "page": null, "isNew": true}, {"id": "app-butsu", "cat": "日本", "icon": "river", "color": "#e3f2fd", "title": "日本一短い川は、わずか13.5メートル", "short": "和歌山の「ぶつぶつ川」。始まりから終わりまで見渡せます。", "body": "和歌山県那智勝浦町を流れる「ぶつぶつ川」は、全長わずか13.5メートル、幅約1メートルの川です。2008年に二級河川に指定されたことで、河川法上の川としては日本一短い川になりました。名前の由来は、川底から湧き出す水の泡の音だと言われています。", "points": ["全長13.5メートル・幅約1メートル", "2008年に二級河川指定で「日本一短い川」に", "水源は湧き水"], "source": "和歌山県・那智勝浦町の公開情報など", "page": null, "isNew": true}, {"id": "app-shinano", "cat": "日本", "icon": "river", "color": "#e3f2fd", "title": "日本一長い川は信濃川、367キロ", "short": "最短の川との差は約27,000倍。", "body": "日本一長い川は、長野県から新潟県へ流れて日本海に注ぐ信濃川で、長さは367キロメートルです。日本一短いぶつぶつ川（13.5メートル）と比べると、約27,000倍の差があります。同じ「川」という言葉の幅の広さが分かる組み合わせです。", "points": ["信濃川は367キロメートル", "長野県から新潟県、日本海へ", "最短の川との差は約27,000倍"], "source": "国土交通省の河川資料など", "page": null, "isNew": true}, {"id": "app-skytree", "cat": "日本", "icon": "tower", "color": "#fce4ec", "title": "東京スカイツリーの高さ634mは「ムサシ」", "short": "数字の語呂合わせで決まった高さ。", "body": "東京スカイツリーの高さは634メートル。この数字は、東京・埼玉・神奈川一帯の旧国名「武蔵（むさし）」の語呂合わせとして知られています。世界一高いタワーの高さが、日本の古い地名に由来しているというのは、ちょっと面白い決まり方です。", "points": ["高さは634メートル", "「武蔵（ムサシ）」の語呂合わせ", "世界一高いタワー"], "source": "東京スカイツリー公式情報など", "page": null, "isNew": true}, {"id": "app-shinsatsu", "cat": "お金", "icon": "bill", "color": "#fff8e1", "title": "2024年の新しいお札、肖像はこの3人", "short": "一万円＝渋沢栄一、五千円＝津田梅子、千円＝北里柴三郎。", "body": "2024年に発行された新しいお札の肖像は、一万円札が渋沢栄一、五千円札が津田梅子、千円札が北里柴三郎です。実業・教育・医学と、それぞれの分野で日本の近代化を支えた人物が選ばれました。裏面にも各地の名所や花が描かれています。", "points": ["一万円：渋沢栄一（実業）", "五千円：津田梅子（教育）", "千円：北里柴三郎（医学）"], "source": "財務省・国立印刷局の公開情報など", "page": null, "isNew": true}, {"id": "app-dice7", "cat": "くらし", "icon": "dice", "color": "#fce4ec", "title": "サイコロの向かい合う面は、足すと必ず7", "short": "1の裏は6、2の裏は5、3の裏は4。", "body": "一般的なサイコロは、向かい合う面の   async saveData(data){
    if(!currentUser || !db) return;
    await setDoc(doc(db, "users", currentUser.uid), {name: currentUser.displayName || "", data: data, updatedAt: serverTimestamp()}, {merge: true});
  }
};
if(auth){
  getRedirectResult(auth).catch(function(){});
  onAuthStateChanged(auth, async function(u){
    currentUser = u;
    window.YF_AUTH.user = u;
    window.YF_AUTH.profile = null;
    if(u && db){
      try {
        const snap = await getDoc(doc(db, "users", u.uid));
        if(snap.exists()) { window.YF_AUTH.profile = snap.data(); }
        else {
          const init = {name: u.displayName || "", createdAt: serverTimestamp(), data: window.YF_SNAPSHOT ? window.YF_SNAPSHOT() : {}};
          await setDoc(doc(db, "users", u.uid), init);
          window.YF_AUTH.profile = init;
        }
      } catch(e){}
    }
    window.dispatchEvent(new CustomEvent("yf-auth"));
  });
}
</script>
</body>
</html>
