<head>

<title>ゆるふわ知恵袋アプリ｜大人のための雑学図鑑</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:#fff8f0;color:#333;line-height:1.65;padding-bottom:78px}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,152,0,.06) 1.2px, transparent 1.2px);background-size:22px 22px;pointer-events:none}
header.app{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,#ff9800,#ff4081);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:11px;box-shadow:0 4px 14px rgba(230,81,0,.25)}
header.app img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);background:#fff}
header.app h1{font-size:18px;margin:0}
header.app p{margin:0;font-size:11.5px;opacity:.92}
.streak{margin-left:auto;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:bold;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:16px 14px 8px;position:relative}
.view{display:none}
.view.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:20px;position:relative;padding-bottom:8px;margin:24px 0 14px}
h2.sec::after{content:"";position:absolute;left:0;bottom:0;width:52px;height:4px;border-radius:2px;background:linear-gradient(90deg,#ff9800,#ff4081)}
.tile{width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:38px;height:38px}
.today{background:#fff;border:2px solid #ffe0b2;border-radius:20px;padding:20px;box-shadow:0 10px 24px rgba(230,81,0,.09)}
.today .head{display:flex;gap:14px;align-items:center}
.today h3{font-size:20px;margin:4px 0 4px;line-height:1.45}
.today p{font-size:14.5px;color:#555;margin:6px 0}
.lbl{display:inline-block;background:#ff9800;color:#fff;font-size:11.5px;font-weight:bold;padding:3px 11px;border-radius:999px}
.lbl.app{background:#7b1fa2}
.lbl.new{background:#e53935}
.btn{display:inline-block;background:#ff9800;color:#fff;border:none;font-weight:bold;padding:11px 20px;border-radius:999px;font-size:14.5px;cursor:pointer;box-shadow:0 4px 12px rgba(255,152,0,.3);text-decoration:none;transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn.sub{background:#fff;color:#e65100;border:2px solid #ff9800;box-shadow:none}
.btn.pink{background:#ff4081;box-shadow:0 4px 12px rgba(255,64,129,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:6px}
.stat4 div{background:#fff;border:2px solid #ffe0b2;border-radius:14px;padding:12px 4px;text-align:center}
.stat4 b{display:block;font-size:21px;color:#e65100;line-height:1.2}
.stat4 span{font-size:11px;color:#888}
@media(max-width:520px){.stat4{grid-template-columns:repeat(2,1fr)}}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.hcard{flex:0 0 230px;scroll-snap-align:start;background:#fff;border:2px solid #ffe0b2;border-radius:16px;padding:15px;cursor:pointer}
.hcard h4{margin:8px 0 4px;font-size:15.5px;line-height:1.45}
.hcard p{margin:0;font-size:12.5px;color:#777}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.catbtn{background:#fff;border:2px solid #ffe0b2;border-radius:16px;padding:13px 8px;text-align:center;cursor:pointer;font-weight:bold;font-size:14px}
.catbtn small{display:block;color:#999;font-weight:normal;font-size:11.5px;margin-top:2px}
.search{width:100%;padding:12px 16px;border:2px solid #ffe0b2;border-radius:999px;font-size:15px;background:#fff;margin:0 0 12px}
.search:focus{outline:none;border-color:#ff9800;box-shadow:0 0 0 4px rgba(255,152,0,.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:2px solid #ff9800;background:#fff;color:#e65100;font-weight:bold;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.chip.on{background:#ff9800;color:#fff}
.sortbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:#777;flex-wrap:wrap}
.sortbar select{padding:8px 10px;border:2px solid #ffe0b2;border-radius:10px;background:#fff;font-size:13.5px}
.tcard{background:#fff;border:2px solid #ffe0b2;border-radius:16px;padding:15px 16px;margin:0 0 12px;box-shadow:0 4px 12px rgba(230,81,0,.06);display:flex;gap:13px}
.tcard .tile{width:50px;height:50px;border-radius:13px}
.tcard .tile svg{width:33px;height:33px}
.tcard h3{margin:2px 0 4px;font-size:16.5px;line-height:1.45}
.tcard p{margin:4px 0;font-size:13.5px;color:#555}
.badges{margin:2px 0 4px}
.tag{display:inline-block;font-size:10.5px;font-weight:bold;padding:2px 8px;border-radius:999px;color:#fff;background:#8e24aa;margin-right:5px}
.tag.video{background:#ff0000}.tag.app{background:#7b1fa2}.tag.new{background:#e53935}.tag.read{background:#9e9e9e}
.cardbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.sbtn{background:#ff9800;color:#fff;border:none;font-weight:bold;border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer}
.sbtn.ghost{background:#fff;border:2px solid #ffcc80;color:#e65100}
.sbtn.on{background:#fff;color:#e65100;border:2px solid #ff9800}
.progress{height:10px;background:#ffe0b2;border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff9800,#ff4081);border-radius:99px;transition:width .4s ease}
.flash{perspective:1000px;margin:6px 0 4px}
.flash-in{position:relative;transition:transform .55s;transform-style:preserve-3d;min-height:250px;cursor:pointer}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:2px solid #ffe0b2;background:#fff;box-shadow:0 10px 24px rgba(230,81,0,.09)}
.face.back{transform:rotateY(180deg);background:#fff3e0;justify-content:flex-start;overflow:auto}
.face h3{font-size:20px;margin:10px 0 6px;line-height:1.5}
.face p{font-size:14.5px;color:#555;text-align:left}
.face .hint{font-size:12px;color:#bbb;margin-top:10px}
.quiz-q{background:#fff;border:2px solid #ffe0b2;border-radius:16px;padding:16px 18px;margin:0 0 14px}
.quiz-q h3{margin:0 0 6px;font-size:16.5px}
.quiz-q .ex{display:none;background:#e8f5e9;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.quiz-q button{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;border:2px solid #ffe0b2;background:#fff8f0;border-radius:10px;font-size:14.5px;cursor:pointer}
.quiz-q button.ok{border-color:#43a047;background:#e8f5e9}
.quiz-q button.ng{border-color:#e53935;background:#ffebee}
.result{background:#fff;border:2px solid #ffe0b2;border-radius:20px;padding:22px;text-align:center;display:none}
.result .rank{font-size:22px;font-weight:bold;color:#e65100;margin:6px 0}
.result .score{font-size:38px;font-weight:bold}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #ffe0b2;display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(230,81,0,.07)}
nav.tabs button{flex:1;background:none;border:none;padding:9px 2px 8px;font-size:11.5px;font-weight:bold;color:#999;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:#e65100}
nav.tabs svg{width:23px;height:23px}
.empty{color:#999;text-align:center;padding:28px 0;font-size:14px}
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(60,30,0,.45)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 20px 30px;animation:up .3s ease;max-width:720px;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-size:20px;margin:8px 0 6px;line-height:1.45}
.sheet .pts{background:#e8f5e9;border-radius:12px;padding:12px 16px;font-size:14px}
.sheet .src{font-size:12px;color:#999;margin-top:12px}
.sheet .close{position:sticky;top:0;float:right;background:#fff3e0;border:none;width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer;color:#e65100;font-weight:bold}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#333;color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
.toast.show{opacity:.95}
.foot-note{text-align:center;color:#bbb;font-size:12px;margin:26px 0 6px}
.foot-note a{color:#bbb}
</style>
</head>
<body>
<header class="app">
  <img src="../IMG_4679.png" alt="ゆるふわ知恵袋">
  <div><h1>ゆるふわ知恵袋アプリ</h1><p>大人のための雑学図鑑 ― 完全版</p></div>
  <div class="streak" id="streak">連続 1 日</div>
</header>
<main>

<section class="view on" id="v-home">
  <h2 class="sec">今日の豆知識</h2>
  <div class="today" id="today-box"></div>
  <div class="row">
    <button class="btn pink" id="rand-btn">ランダムで1つ見る</button>
    <button class="btn sub" id="goto-cards">カードで覚える</button>
  </div>
  <h2 class="sec">動画の豆知識</h2>
  <div class="hscroll" id="video-row"></div>
  <h2 class="sec">カテゴリから探す</h2>
  <div class="cats" id="cat-grid"></div>
  <h2 class="sec">新着・アプリ限定の豆知識</h2>
  <div id="new-list"></div>
  <h2 class="sec">あなたの記録</h2>
  <div class="stat4">
    <div><b id="st-read">0</b><span>読んだ数</span></div>
    <div><b id="st-fav">0</b><span>お気に入り</span></div>
    <div><b id="st-learn">0</b><span>覚えたカード</span></div>
    <div><b id="st-best">-</b><span>クイズ最高</span></div>
  </div>
  <p style="font-size:12.5px;color:#999;margin-top:10px">記録はこの端末の中にだけ保存されます。</p>
</section>

<section class="view" id="v-list">
  <h2 class="sec">豆知識一覧</h2>
  <input class="search" type="text" id="q" placeholder="キーワードで検索（例：富士山、ポスト、川）">
  <div class="chips" id="chips"></div>
  <div class="sortbar">
    <label>並び順 <select id="sort"><option value="rec">おすすめ順</option><option value="cat">カテゴリ順</option><option value="name">タイトル順</option></select></label>
    <label>表示 <select id="readf"><option value="all">すべて</option><option value="unread">未読のみ</option></select></label>
  </div>
  <div id="list"></div>
  <p class="empty" id="list-empty" style="display:none">見つかりませんでした。条件を変えてみてください。</p>
</section>

<section class="view" id="v-cards">
  <h2 class="sec">フラッシュカード</h2>
  <p style="font-size:14px;color:#555;margin-top:0">カードをタップすると裏返って解説が出ます。「覚えた」を押して進めよう。</p>
  <div class="chips" id="deck-chips"></div>
  <div class="progress"><i id="deck-prog" style="width:0%"></i></div>
  <p style="font-size:13px;color:#888;margin:4px 0" id="deck-count"></p>
  <div class="flash" id="flash"><div class="flash-in" id="flash-in"></div></div>
  <div class="row">
    <button class="btn sub" id="card-again">まだ</button>
    <button class="btn" id="card-ok">覚えた</button>
    <button class="btn sub" id="card-shuffle">シャッフル</button>
  </div>
</section>

<section class="view" id="v-quiz">
  <h2 class="sec">ゆるふわクイズ</h2>
  <div class="chips">
    <button class="chip on" id="mode10">全10問に挑戦</button>
    <button class="chip" id="mode5">ランダム5問</button>
  </div>
  <div class="progress"><i id="quiz-prog" style="width:0%"></i></div>
  <div id="quiz"></div>
  <div class="result" id="result">
    <p style="margin:0;color:#888;font-size:13px">結果</p>
    <p class="score" id="result-score"></p>
    <p class="rank" id="result-rank"></p>
    <p id="result-msg" style="font-size:14px;color:#555"></p>
    <div class="row" style="justify-content:center">
      <button class="btn" id="quiz-retry">もう一度やる</button>
      <button class="btn sub" id="result-share">結果をシェア</button>
    </div>
  </div>
</section>

<section class="view" id="v-fav">
  <h2 class="sec">お気に入り</h2>
  <div id="favlist"></div>
  <p class="empty" id="fav-empty">まだお気に入りがありません。一覧や詳細から追加してみてください。</p>
</section>

<p class="foot-note"><a href="../index.html">ゆるふわ知恵袋 公式サイトへ</a></p>
</main>

<div class="sheet" id="sheet">
  <div class="bg" id="sheet-bg"></div>
  <div class="panel" id="sheet-panel"></div>
</div>
<div class="toast" id="toast"></div>

<nav class="tabs">
  <button data-v="v-home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 4 L21 11"/><path d="M5 10 V20 H19 V10"/></svg>ホーム</button>
  <button data-v="v-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>一覧</button>
  <button data-v="v-cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="15" height="13" rx="2"/><path d="M7 6 V5 a2 2 0 0 1 2-2 h10 a2 2 0 0 1 2 2 v10 a2 2 0 0 1-2 2 h-1"/></svg>カード</button>
  <button data-v="v-quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3 A2.6 2.6 0 1 1 12 12.4 V13.6"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>クイズ</button>
  <button data-v="v-fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5 L4.8 13.6 A5 5 0 0 1 12 6.4 A5 5 0 0 1 19.2 13.6 Z"/></svg>お気に入り</button>
</nav>

var TRIVIA = [{"id": "fuji1", "cat": "日本", "icon": "fuji", "color": "#e3f2fd", "title": "富士山の8合目から上は神社の土地", "short": "山頂は国の土地ではなく、神社の境内地です。", "body": "富士山の8合目以上は、富士山本宮浅間大社の境内地です。広さは約385万平方メートルで、東京ドーム約82個分。登山道の後半は、神社の境内を登っていることになります。", "points": ["広さは約385万平方メートル（東京ドーム約82個分）", "所有者は富士山本宮浅間大社（静岡県富士宮市）", "山頂に立つ場所は「神社の境内」"], "source": "富士山本宮浅間大社・静岡県の文化財資料など", "page": "../fuji.html", "isNew": false}, {"id": "fuji2", "cat": "日本", "icon": "fuji", "color": "#e3f2fd", "title": "富士山の土地を決めたのは徳川家康", "short": "1609年の朱印状から、2004年の正式返還まで。", "body": "富士山山頂部の権利の出発点は、1609年に徳川家康が浅間大社へ与えた朱印状です。明治時代に一度は国の土地になりましたが、1974年の最高裁判決で神社の所有が認められ、2004年に正式に返還されました。", "points": ["1609年：家康の朱印状", "1974年：最高裁で神社の所有が確定", "2004年：正式に譲渡（返還）"], "source": "静岡県「史跡富士山 保存管理計画」など", "page": "../fuji.html", "isNew": false}, {"id": "senen1", "cat": "お金", "icon": "coin", "color": "#fff8e1", "title": "1万円玉を作らない理由は偽造対策", "short": "「作ればいいじゃん」への答えは、偽造の儲け。", "body": "安い金属で1万円玉を作ると、額面1万円に対して材料費がわずかなので、偽造すれば大儲けになってしまいます。防ぐには高い金属を使うか大きく重く作るしかなく、どちらも現実的ではありません。だから高額は、高度な偽造防止を入れられるお札が担っています。", "points": ["安い金属＝偽造が儲かりすぎる", "高い金属＝相場が上がると溶かされるリスク", "お札は透かし・ホログラムなど高度な対策が可能"], "source": "造幣局・国立印刷局の公開情報など", "page": "../senen.html", "isNew": false}, {"id": "senen2", "cat": "お金", "icon": "coin", "color": "#fff8e1", "title": "500円玉は偽造で大問題になった", "short": "世界有数の高額硬貨ゆえの事件と、緊急の作り直し。", "body": "500円硬貨は、普通に流通する硬貨としては世界でも有数の高額硬貨です。外国の低価値硬貨を加工した変造硬貨が大量に出回る事件が起き、2000年に素材を変えた新しい500円玉への緊急の作り直しが行われました。2021年には2色・3層構造のバイカラー・クラッドが採用されています。", "points": ["500円硬貨は世界でも有数の高額な流通硬貨", "2000年に素材変更＋偽造対策を強化", "2021年にバイカラー・クラッド採用"], "source": "造幣局の硬貨資料など", "page": "../senen.html", "isNew": false}, {"id": "senen3", "cat": "お金", "icon": "bill", "color": "#fff8e1", "title": "お札は1枚約1グラム", "short": "500円玉20枚との差は、約142倍。", "body": "お札の重さは1枚約1グラム。一方、500円玉は1枚7.1グラムあるので、1万円分を500円玉で持つと20枚で約142グラムになります。大きな金額を持ち運ぶ軽さでも、お札が圧倒的に有利です。", "points": ["お札：1枚約1グラム", "500円玉：1枚7.1グラム", "1万円分＝500円玉20枚で約142グラム"], "source": "国立印刷局・造幣局の公開情報など", "page": "../senen.html", "isNew": false}, {"id": "nichigin1", "cat": "日本", "icon": "bank", "color": "#efebe9", "title": "日銀の形は「円」に見える", "short": "でも完成当時の漢字は「圓」でした。", "body": "日本銀行本店を上から見ると「円」の字に見えます。ところが建物が完成した1896年当時、お金の単位の漢字は「圓」。設計で今の「円」を狙ったわけではなく、後の増築の結果として生まれた、奇跡のような形だと言われています。", "points": ["完成は1896年（明治29年）", "当時の表記は「圓」", "今の形は増築の結果"], "source": "日本銀行の公開資料など", "page": "../nichigin.html", "isNew": false}, {"id": "saikoro1", "cat": "くらし", "icon": "dice", "color": "#fce4ec", "title": "サイコロの赤い「1」は日本だけ", "short": "日の丸に見立てたのが始まり、という説。", "body": "海外のサイコロは、すべての目が黒など同色なのが一般的です。1だけ赤いのは日本のサイコロの特徴で、1926年に和歌山の業者が「1」を日の丸に見立てて赤く塗ったところ大ヒットした、という説があります。", "points": ["海外のサイコロは全目が同色が一般的", "始まりは1926年という説", "日の丸に見立てて赤く塗った"], "source": "各種報道・資料で紹介される説", "page": "../saikoro.html", "isNew": false}, {"id": "muse1", "cat": "テクノロジー", "icon": "robot", "color": "#e0f2f1", "title": "AIに無茶振りしたら全部やってきた件", "short": "「ゲーム作って」→39種類、「予定入れて」→109件。", "body": "「対戦ゲーム作って」と頼んだら39種類が完成し、「予定を全部入れて」と頼んだら109件が入力されました。質問に答えるだけでなく、調べる・作る・入力するといった作業そのものを実行するのが、エージェント型AIの特徴です。", "points": ["対戦ゲームは実際に39種類完成", "予定入力は実際に109件", "数字はすべて実話ベース"], "source": "ゆるふわ知恵袋の制作記録", "page": "../muse.html", "isNew": false}, {"id": "app-ichien", "cat": "お金", "icon": "drop", "color": "#e1f5fe", "title": "1円玉は水に浮く", "short": "重さちょうど1グラム、そっと置くと浮きます。", "body": "1円玉は純アルミニウム製で、直径20ミリ、重さはちょうど1グラム。乾いた1円玉を水面に平行にそっと置くと、表面張力と浮力が釣り合って、水に浮かせることができます。表面には「若木」のデザインが描かれています。", "points": ["直径20ミリ・重さちょうど1グラム", "素材は純アルミニウム（1955年〜）", "表面張力で水に浮く"], "source": "造幣局の硬貨規格など", "page": null, "isNew": true}, {"id": "app-ichiencost", "cat": "お金", "icon": "coin", "color": "#fff8e1", "title": "1円玉を作るのに約3円かかる", "short": "額面より高い製造コスト。", "body": "1円硬貨1枚を作る製造コストは、額面の1円を上回ります。2015年時点の試算では約3円とされていました。アルミニウムの価格や製造方法で変動しますが、「作るほど赤字」という逆転現象が起きている硬貨です。5円・10円硬貨も同様に額面以上のコストとされています。", "points": ["製造コストは額面以上", "2015年時点の試算で約3円", "5円・10円も同様とされる"], "source": "造幣局への取材報道など", "page": null, "isNew": true}, {"id": "app-post", "cat": "くらし", "icon": "post", "color": "#ffebee", "title": "郵便ポストは、最初は黒かった", "short": "勘違い事件がきっかけで赤になりました。", "body": "日本の郵便ポストは、始まりの1871年当時は木製や黒塗りでした。ところが黒いポストは夜に見えにくく、「郵便」を「垂便」と読み違える勘違いまで発生。そこで1901年に鉄製の赤いポストが試験導入され、「目立って分かりやすい色」として赤が定着し、1908年に正式に定められました。", "points": ["1871年の開始当初は黒や木製", "1901年に赤い鉄製ポストを試験導入", "理由は「目立って分かりやすく」"], "source": "郵便ポストの歴史資料・逓信省年報など", "page": null, "isNew": true}, {"id": "app-butsu", "cat": "日本", "icon": "river", "color": "#e3f2fd", "title": "日本一短い川は、わずか13.5メートル", "short": "和歌山の「ぶつぶつ川」。始まりから終わりまで見渡せます。", "body": "和歌山県那智勝浦町を流れる「ぶつぶつ川」は、全長わずか13.5メートル、幅約1メートルの川です。2008年に二級河川に指定されたことで、河川法上の川としては日本一短い川になりました。名前の由来は、川底から湧き出す水の泡の音だと言われています。", "points": ["全長13.5メートル・幅約1メートル", "2008年に二級河川指定で「日本一短い川」に", "水源は湧き水"], "source": "和歌山県・那智勝浦町の公開情報など", "page": null, "isNew": true}, {"id": "app-shinano", "cat": "日本", "icon": "river", "color": "#e3f2fd", "title": "日本一長い川は信濃川、367キロ", "short": "最短の川との差は約27,000倍。", "body": "日本一長い川は、長野県から新潟県へ流れて日本海に注ぐ信濃川で、長さは367キロメートルです。日本一短いぶつぶつ川（13.5メートル）と比べると、約27,000倍の差があります。同じ「川」という言葉の幅の広さが分かる組み合わせです。", "points": ["信濃川は367キロメートル", "長野県から新潟県、日本海へ", "最短の川との差は約27,000倍"], "source": "国土交通省の河川資料など", "page": null, "isNew": true}, {"id": "app-skytree", "cat": "日本", "icon": "tower", "color": "#fce4ec", "title": "東京スカイツリーの高さ634mは「ムサシ」", "short": "数字の語呂合わせで決まった高さ。", "body": "東京スカイツリーの高さは634メートル。この数字は、東京・埼玉・神奈川一帯の旧国名「武蔵（むさし）」の語呂合わせとして知られています。世界一高いタワーの高さが、日本の古い地名に由来しているというのは、ちょっと面白い決まり方です。", "points": ["高さは634メートル", "「武蔵（ムサシ）」の語呂合わせ", "世界一高いタワー"], "source": "東京スカイツリー公式情報など", "page": null, "isNew": true}, {"id": "app-shinsatsu", "cat": "お金", "icon": "bill", "color": "#fff8e1", "title": "2024年の新しいお札、肖像はこの3人", "short": "一万円＝渋沢栄一、五千円＝津田梅子、千円＝北里柴三郎。", "body": "2024年に発行された新しいお札の肖像は、一万円札が渋沢栄一、五千円札が津田梅子、千円札が北里柴三郎です。実業・教育・医学と、それぞれの分野で日本の近代化を支えた人物が選ばれました。裏面にも各地の名所や花が描かれています。", "points": ["一万円：渋沢栄一（実業）", "五千円：津田梅子（教育）", "千円：北里柴三郎（医学）"], "source": "財務省・国立印刷局の公開情報など", "page": null, "isNew": true}, {"id": "app-dice7", "cat": "くらし", "icon": "dice", "color": "#fce4ec", "title": "サイコロの向かい合う面は、足すと必ず7", "short": "1の裏は6、2の裏は5、3の裏は4。", "body": "一般的なサイコロは、向かい合う面の数字を足すと必ず7になるよう作られています。1の裏は6、2の裏は5、3の裏は4。どの面を上に出しても、裏側との合計が一定になるという、シンプルで美しいルールです。手元のサイコロで確かめてみてください。", "points": ["1の裏は6、2の裏は5、3の裏は4", "合計はいつも7", "ボードゲーム用サイコロの基本ルール"], "source": "サイコロの一般的な規格", "page": null, "isNew": true}, {"id": "app-ramen", "cat": "食べ物", "icon": "bowl", "color": "#fff3e0", "title": "インスタントラーメンは1958年の発明", "short": "安藤百福のチキンラーメンが最初。", "body": "インスタントラーメンは、1958年に安藤百福が発明した「チキンラーメン」が始まりとされています。お湯をかけるだけで食べられる手軽さが受けて世界中に広がり、1971年にはカップ麺も登場。今では世界中で年間1,000億食以上が食べられる食べ物になりました。", "points": ["1958年、安藤百福が発明", "最初はチキンラーメン", "カップ麺は1971年登場"], "source": "カップヌードルミュージアム等の資料", "page": null, "isNew": true}, {"id": "app-kaiten", "cat": "食べ物", "icon": "sushi", "color": "#e0f2f1", "title": "回転寿司は大阪生まれ", "short": "ヒントは工場のベルトコンベア。", "body": "回転寿司は、1958年に大阪で開店した「元禄寿司」が始まりとされています。店主がビール工場のベルトコンベアを見て「寿司も流せばいい」とひらめいたのがきっかけだと言われています。職人の数に限らず多くの客に寿司を提供できる仕組みとして、全国に広がりました。", "points": ["1958年、大阪の元禄寿司が始まりとされる", "ヒントは工場のベルトコンベア", "今や世界中で見かける形式に"], "source": "回転寿司の歴史資料など", "page": null, "isNew": true}, {"id": "app-forest", "cat": "日本", "icon": "tree", "color": "#e8f5e9", "title": "日本の国土の約3分の2は森林", "short": "先進国でも有数の森林大国。", "body": "日本の国土に占める森林の割合は約67パーセントで、国土のおよそ3分の2が森林です。これは世界的に見ても高い割合で、日本は先進国の中でも有数の森林国と言われます。山が多い地形と、雨の多い気候が背景にあります。", "points": ["森林率は約67パーセント", "国土の約3分の2が森林", "先進国でも有数の割合"], "source": "林野庁の統計など", "page": null, "isNew": true}, {"id": "app-escalator", "cat": "くらし", "icon": "steps", "color": "#fff3e0", "title": "エスカレーター、東京と大阪で立つ側が逆", "short": "東京は左、大阪は右が一般的。", "body": "エスカレーターで片側を空けるとき、東京では左側に立ち、大阪では右側に立つ人が多いと言われています。急ぐ人のために片側を空ける習慣自体は各地にありますが、「どちら側か」は地域で違うという面白い例です。最近は「歩かずに両側に立つ」呼びかけも増えています。", "points": ["東京：左に立つことが多い", "大阪：右に立つことが多い", "最近は両側立ちの呼びかけも"], "source": "各地の利用習慣に関する報道など", "page": null, "isNew": true}];

function showQuestion(){
  qLock = false;
  $("quiz-prog").style.width = (qList.length ? (qIdx / qList.length * 100) : 0) + "%";
  if(qIdx >= qList.length){ showResult(); return; }
  var item = qList[qIdx];
  var h = '<div class="quiz-q"><p style="margin:0;color:#b07d2b;font-weight:bold;font-size:12.5px">問題 ' + (qIdx + 1) + ' / ' + qList.length + '</p><h3>' + item.q + '</h3>';
  item.a.forEach(function(t, j){ h += '<button data-a="' + j + '">' + t + '</button>'; });
  h += '<div class="ex" id="qex"></div></div>';
  $("quiz").innerHTML = h;
  $("quiz").querySelectorAll("button[data-a]").forEach(function(b){
    b.onclick = function(){
      if(qLock) return; qLock = true;
      var j = +b.dataset.a, ok = j === item.c;
      b.classList.add(ok ? "ok" : "ng");
      if(ok) qScore++;
      var ex = $("qex"); ex.style.display = "block";
      ex.innerHTML = (ok ? "正解！ " : "残念、正解は「" + item.a[item.c] + "」。 ") + item.ex +
        (item.rel ? ' <a href="#" onclick="openDetail(\'' + item.rel + '\');return false;">豆知識で復習する</a>' : "") +
        '<div style="margin-top:10px"><button class="sbtn" id="qnext">' + (qIdx + 1 >= qList.length ? "結果を見る" : "次の問題へ") + '</button></div>';
      $("qnext").onclick = function(){ qIdx++; showQuestion(); };
    };
  });
}
function rankOf(score, total){
  var r = score / total;
  if(r >= 1) return ["知恵袋マスター", "全問正解！誰かに話したくなる豆知識が、しっかり身についています。"];
  if(r >= 0.8) return ["知恵袋の達人", "あと少しで全問正解。間違えた問題は豆知識で復習できます。"];
  if(r >= 0.5) return ["知恵袋のたまご", "半分以上正解。カードで覚えると、もっと伸びます。"];
  return ["かけだし知恵袋", "まずは今日の豆知識から。繰り返すと自然に覚えられます。"];
}
function showResult(){
  $("quiz").innerHTML = "";
  $("quiz-prog").style.width = "100%";
  var rk = rankOf(qScore, qList.length);
  $("result-score").textContent = qScore + " / " + qList.length + " 点";
  $("result-rank").textContent = rk[0];
  $("result-msg").textContent = rk[1];
  $("result").style.display = "block";
  var best = +(localStorage.getItem("yf_best") || 0);
  if(qScore > best){ localStorage.setItem("yf_best", qScore); toast("最高得点を更新しました"); }
  renderStats();
}
$("mode10").onclick = function(){ qMode = 10; $("mode10").classList.add("on"); $("mode5").classList.remove("on"); startQuiz(); };
$("mode5").onclick = function(){ qMode = 5; $("mode5").classList.add("on"); $("mode10").classList.remove("on"); startQuiz(); };
$("quiz-retry").onclick = startQuiz;
$("result-share").onclick = function(){
  var text = "【ゆるふわ知恵袋クイズ】" + qScore + " / " + qList.length + " 点でした！";
  if(navigator.share){ navigator.share({title: "ゆるふわ知恵袋アプリ", text: text, url: location.href.split("#")[0]}).catch(function(){}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text); toast("コピーしました"); }
};
/* タブ */
function switchView(id){
  document.querySelectorAll("nav.tabs button").forEach(function(x){ x.classList.toggle("on", x.dataset.v === id); });
  document.querySelectorAll(".view").forEach(function(v){ v.classList.toggle("on", v.id === id); });
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach(function(b){ b.onclick = function(){ switchView(b.dataset.v); }; });
function refresh(){ renderStats(); renderHome(); renderList(); renderFavs(); }
streakInit(); renderChips(); renderDeckChips(); buildDeck(); refresh(); startQuiz();
</script>
